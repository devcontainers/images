version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  - package-ecosystem: docker
    directories:
      - /.devcontainer
      - /src/*/.devcontainer
      - /build/assets
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  - package-ecosystem: devcontainers
    directories:
      - /
      - /src/*
    schedule:
      interval: weekly
    open-pull-requests-limit: 10