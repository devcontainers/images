name: Smoke test "miniconda" build (arm64)

on:
  workflow_dispatch:
  push:
    branches:
    - main
  pull_request:
    paths:
      - src/miniconda/**
      - .github/workflows/smoke-miniconda-arm64.yaml
      - .github/actions/**
      - build/**

jobs:
  smoke-test:
    name: Smoke test (linux/arm64)
    runs-on: ubuntu-24.04-arm
    steps:

    - name: Checkout
      id: checkout
      uses: actions/checkout@v6

    - name: Show runner architecture
      run: |
        uname -m
        docker version --format 'Docker {{.Server.Version}} ({{.Server.Os}}/{{.Server.Arch}})'

    - name: Smoke test
      id: smoke_test
      uses: ./.github/actions/smoke-test
      with:
        image: miniconda
